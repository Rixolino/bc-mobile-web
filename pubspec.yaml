name: bc_transporter
description: App mobile BC. Transporter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  provider: ^6.0.0
  http: ^1.6.0
  intl: ^0.18.0
  equatable: ^2.0.5
  #protobuf: ^2.0.0
  #gtfs_realtime_bindings: ^1.0.1
  
  # Map & Location
  webview_flutter: ^4.4.2
  geolocator: ^10.1.0
  url_launcher: ^6.2.0
  
  # UI
  sliding_up_panel: ^2.0.0+1
  glassmorphism: ^3.0.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2

  # Persistence & DB
  shared_preferences: ^2.5.4
  libsql_dart: ^0.7.0
  bcrypt: ^1.1.3

  # Map
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^8.0.1
  shimmer: ^3.0.0
  path_provider: ^2.1.5
  flutter_svg: ^2.2.3
  marquee: ^2.3.0
  vector_graphics: ^1.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.11.0
  vector_graphics_compiler: ^1.2.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/bus_icon_1024.png"
  adaptive_icon_background: "assets/icons/bus_icon_1024.png"
  adaptive_icon_foreground: "assets/icons/bus_icon_1024_transparent.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
